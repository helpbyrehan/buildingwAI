<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Saved AP Study Hub resources."><title>Saved Resources | AP Study Hub</title><link rel="stylesheet" href="../assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/config.js"></script><script defer src="../assets/app.js"></script></head><body><a class="skip" href="#main">Skip to content</a><header class="topbar"><div class="container nav" role="navigation" aria-label="Main navigation"><a class="brand" href="../"><span class="mark" aria-hidden="true">AP</span><strong>AP STUDY HUB <span>· resources</span></strong></a><button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰</button><nav class="navlinks"><a href="../">Home</a><a href="../browse/">Browse</a><a href="../courses/">Courses</a><a class="active" href="../saved/">Saved</a><a href="../add/">Add Your Findings</a></nav><div class="nav-actions"><a class="btn btn-primary" href="../login/">Login</a><button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">◐</button></div></div></header><main id="main"><section class="page-head"><div class="container"><h1>Saved resources</h1><p>Your saved resources are stored in this browser.</p></div></section><section class="section" style="padding-top:10px"><div class="container"><div class="resource-grid" id="savedList"><div class="loading">Loading saved resources…</div></div></div></section></main><footer class="footer"><div class="container footer-row"><span>AP Study Hub · Built for students, by students.</span><span>Use the library. Share what helps.</span></div></footer><div id="toast" class="toast" role="status" aria-live="polite"></div><script>document.addEventListener('DOMContentLoaded',async()=>{const list=document.getElementById('savedList');let ids=[];try{ids=JSON.parse(localStorage.getItem('apsh-saved')||'[]')}catch{};if(!ids.length){list.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>Nothing saved yet</h3><p>Use the ☆ button on a resource to keep it here.</p><a class="btn btn-primary" href="../browse/">Browse Resources</a></div>';return}setTimeout(async()=>{const d=window.APSH_DATA; if(!d){list.innerHTML='<div class="empty"><h3>Unable to load resources</h3><p>Refresh the page and try again.</p></div>';return}const items=d.resources.filter(r=>ids.map(String).includes(String(r.id)));list.innerHTML=items.length?items.map(r=>{const c=d.courses.find(x=>String(x.id)===String(r.course_id));return `<article class="resource-card"><div class="resource-top"><span class="resource-type">${APSH.esc(r.resource_type||'Resource')}</span><button class="save saved" data-save="${APSH.esc(r.id)}">★</button></div><h3>${APSH.esc(r.title)}</h3><p>${APSH.esc(r.description||'No description provided.')}</p><div class="chips"><span class="chip">${APSH.esc(c?.name||'')}</span>${r.year?`<span class="chip">${APSH.esc(r.year)}</span>`:''}</div><div class="resource-actions"><a class="btn btn-primary" href="../resource/?id=${encodeURIComponent(r.id)}">View Resource</a></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1"><h3>Those resources are no longer available</h3><p>They may have been removed or are no longer approved.</p></div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let a=JSON.parse(localStorage.getItem('apsh-saved')||'[]');a=a.filter(x=>String(x)!==String(b.dataset.save));localStorage.setItem('apsh-saved',JSON.stringify(a));location.reload()})},300)})</script></body></html>
