<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece6">
  <title>Not found | AP Study Hub">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #eeece6;
      color: #11110f;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      border: 1px solid #11110f;
      padding: clamp(32px, 7vw, 80px);
      background: #eeece6;
    }

    .eyebrow {
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: .12em;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 13vw, 150px);
      line-height: .82;
      letter-spacing: -.07em;
      font-weight: 700;
    }

    p {
      max-width: 480px;
      margin: 36px 0;
      font-size: 18px;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid #11110f;
      background: #11110f;
      color: #eeece6;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }

    a:hover {
      background: #eeece6;
      color: #11110f;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .page {
        padding: 16px;
      }

      .card {
        padding: 32px 24px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>

</head>

<body>
  <main class="page">
    <section class="card">
      <div class="eyebrow">404 / PAGE NOT FOUND</div>
