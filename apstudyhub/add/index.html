<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Share a useful AP resource."><meta name="theme-color" content="#07090b"><title>Add | AP Study Hub</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../assets/styles.css?v=20260922m"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.APSH_BASE='../';</script><script src="../assets/config.js"></script><script defer src="../assets/app.js?v=20260922m"></script></head><body><a class="skip" href="#main">Skip to content</a><header class="topbar"><div class="container nav"><a class="brand" href="../"><img class="mark" src="../assets/logo.svg" alt="" aria-hidden="true"><strong>AP STUDY HUB <span>· resources</span></strong></a>
<button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false">☰</button>
<nav class="navlinks" aria-label="Primary"><a data-nav href="../browse/" class="">Search</a><a data-nav href="../courses/" class="">Courses</a><a data-nav href="../saved/" class="">Saved</a><a data-nav href="../add/" class="active">Add</a></nav>
<div class="nav-actions"><span data-user-slot></span><button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☼</button></div></div></header>
<main id="main" data-add="true"><section class="page-head"><div class="container"><div class="eyebrow">Contribute</div><h1>Share something useful.</h1><p>Uploads are reviewed before they become public.</p></div></section>
<section class="section" style="padding-top:10px"><div class="container"><div class="panel reveal"><div id="formNotice" class="notice hide" role="alert"></div>
<form id="addForm" class="form-grid" novalidate>
<div class="field"><label>Subject</label><select class="select" id="addSubject" required></select></div><div class="field"><label>Course</label><select class="select" id="addCourse" required></select></div>
<div class="field"><label>Year</label><select class="select" id="addYear"><option value="">Any year</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option></select></div>
<div class="field"><label>Unit</label><select class="select" id="addUnit"></select></div>
<div class="field"><label>Type</label><select class="select" id="resourceType" required><option value="">Select type</option><option>Study Guide</option><option>Unit Guide</option><option>Notes</option><option>Practice Questions</option><option>Practice Test</option><option>Flashcards</option><option>Formula Sheet</option><option>Review</option><option>Video</option><option>Other</option></select></div>
<div class="field"><label>Title</label><input class="input" id="resourceTitle" maxlength="180" required placeholder="Kinematics review"></div>
<div class="field full"><label>Description</label><textarea class="textarea" id="resourceDescription" maxlength="2000" placeholder="What does it cover?"></textarea></div>
<div class="field full"><label>Source</label><div class="inline"><label><input type="radio" name="resourceMode" value="file" checked> PDF</label><label><input type="radio" name="resourceMode" value="link"> Link</label></div></div>
<div class="field full" id="fileBox"><div class="dropzone"><label class="btn btn-secondary" for="resourceFile">Choose PDF</label><input id="resourceFile" type="file" accept="application/pdf"><p class="help">PDF only · max 25 MB</p></div></div>
<div class="field full hide" id="linkBox"><label>External URL</label><input class="input" id="externalUrl" type="url" placeholder="https://…"></div>
<div class="full inline" style="justify-content:flex-end"><button class="btn btn-primary" type="submit">Submit</button></div>
</form></div></div></section></main><footer class="footer"><div class="container footer-row"><span>AP Study Hub · Built for students, by students.</span><span>Search. Save. Share.</span></div></footer><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
